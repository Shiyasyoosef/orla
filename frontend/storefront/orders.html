<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | OrlaTrends</title><link rel="stylesheet" href="css/customer.css"></head><body><main class="page-wrap"><a class="brand-word" href="index.html">OrlaTrends</a><p class="page-kicker">Account</p><h1 class="page-title">My Orders</h1><section id="orders" class="checkout-card"></section></main><script src="js/commerce-flow.js"></script><script>let a=OrlaFlow.orders(),r=document.querySelector('#orders');r.innerHTML=a.length?a.map(o=>`<div class="order-line"><span><strong>${o.id}</strong><br>${new Date(o.date).toLocaleDateString()} · ${o.items.length} item(s)</span><span><strong>${OrlaFlow.money(o.total)}</strong><br><span class="badge">${o.status}</span></span></div>`).join(''):'<div class="empty-state">No orders yet. <a href="index.html">Start shopping</a></div>'</script></body></html>
