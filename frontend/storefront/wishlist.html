<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wishlist | OrlaTrends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600;700" rel="stylesheet">
  <link rel="stylesheet" href="css/customer.css">
</head>
<body class="store-page wishlist-page">
  <main class="wishlist-main" aria-labelledby="wishlistTitle">
    <div class="wishlist-title-row">
      <a class="wishlist-back" href="index.html" aria-label="Back to shopping">
        <span aria-hidden="true">‹</span>
      </a>
      <div>
        <h1 id="wishlistTitle">Wishlist</h1>
        <p id="wishlistCount">0 items</p>
      </div>
    </div>

    <section id="wishlistGrid" class="wishlist-content" aria-live="polite"></section>
  </main>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="size-drawer" id="sizeDrawer" aria-hidden="true" aria-label="Add wishlist item to bag">
    <div class="drawer-content">
      <div class="drawer-head">
        <button class="drawer-close" id="closeDrawer" type="button" aria-label="Close">x</button>
        <div class="drawer-product" id="drawerProduct"></div>
      </div>
      <div class="drawer-body">
        <strong>Size</strong>
        <div class="size-row-shop" id="sizeChoices"></div>
        <p class="page-subtitle">Pick a size to move this wishlist item into your bag.</p>
      </div>
      <div class="drawer-foot">
        <button class="bag-btn" id="drawerAddToBag" type="button">Add to Bag</button>
      </div>
    </div>
  </aside>
  <div class="toast" id="storeToast" role="status"></div>

  <nav class="mobile-commerce-nav" aria-label="Mobile bottom navigation">
    <a href="index.html"><span class="material-symbols-outlined">home</span><span>Home</span></a>
    <a href="category.html?category=new-in"><span class="material-symbols-outlined">category</span><span>Categories</span></a>
    <a href="index.html#sale"><span class="material-symbols-outlined">sell</span><span>Sale</span></a>
    <a href="customer-login.html"><span class="material-symbols-outlined">person_add</span><span>Account</span></a>
    <a href="cart.html"><span class="material-symbols-outlined">shopping_cart_checkout</span><span>Cart</span></a>
  </nav>

  <script src="js/commerce-flow.js"></script>
  <script src="js/wishlist.js"></script>
</body>
</html>
