<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment | OrlaTrends</title><link rel="stylesheet" href="css/customer.css"></head><body><main class="page-wrap"><a class="brand-word" href="index.html">OrlaTrends</a><p class="page-kicker">Checkout / Payment</p><h1 class="page-title">Choose payment</h1><section class="checkout-layout"><form id="pay" class="checkout-card form-grid"><div class="field"><label>Payment method</label><select name="method"><option>Cash on delivery</option><option>Card (demo)</option></select></div><div class="field"><label>Card holder (for card)</label><input name="holder" autocomplete="cc-name"></div><button class="secondary-btn">Place order</button></form><aside class="panel-card"><h2>Total</h2><strong id="total"></strong><p class="page-subtitle">No payment is charged in this demo flow.</p></aside></section></main><script src="js/commerce-flow.js"></script><script>document.querySelector('#total').textContent=OrlaFlow.money(OrlaFlow.total(OrlaFlow.get()));document.querySelector('#pay').onsubmit=e=>{e.preventDefault();let a=OrlaFlow.get();if(!a.length){location='cart.html';return}let o={id:'OT-'+Date.now().toString().slice(-8),date:new Date().toISOString(),status:'Processing',items:a,total:OrlaFlow.total(a),payment:new FormData(e.target).get('method')};OrlaFlow.saveOrders([o,...OrlaFlow.orders()]);OrlaFlow.set([]);location='order-success.html?id='+encodeURIComponent(o.id)}</script></body></html>
