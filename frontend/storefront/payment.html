<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment | OrlaTrends</title><link rel="stylesheet" href="css/customer.css"></head><body><main class="page-wrap"><a class="brand-word" href="index.html">OrlaTrends</a><p class="page-kicker">Checkout / Payment</p><h1 class="page-title">Choose payment</h1><section class="checkout-layout"><form id="pay" class="checkout-card form-grid"><div id="paymentError" class="error-box"></div><div class="field"><label>Payment method</label><select name="method"><option>Cash on delivery</option><option>Card (demo)</option></select></div><div class="field"><label>Card holder (for card)</label><input name="holder" autocomplete="cc-name"></div><button class="secondary-btn">Place order</button></form><aside class="panel-card"><h2>Total</h2><strong id="total"></strong><p class="page-subtitle">No payment is charged in this demo flow.</p></aside></section></main><script src="js/customer-auth.js"></script><script src="js/commerce-flow.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const totalEl=document.querySelector("#total"),form=document.querySelector("#pay"),error=document.querySelector("#paymentError");const cart=OrlaFlow.get();totalEl.textContent=OrlaFlow.money(OrlaFlow.total(cart));const customer=await OrlaCustomer.requireAuth();if(!customer)return;form.onsubmit=async e=>{e.preventDefault();OrlaCustomer.showMessage(error,"");let items=OrlaFlow.get();if(!items.length){location="cart.html";return}const button=e.submitter;OrlaCustomer.setLoading(button,true,"Placing order...");try{const checkout=OrlaFlow.checkout();const paymentMethod=new FormData(form).get("method");const payload={items,total:OrlaFlow.total(items),paymentMethod,selectedAddressId:checkout.selectedAddressId,shippingAddress:checkout.shippingAddress};const data=await OrlaCustomer.api("/api/v1/customer/orders",{method:"POST",body:JSON.stringify(payload)});const order=data.order||{};const localOrder={id:order.order_number||order.id,date:new Date().toISOString(),status:order.status||"processing",items,total:payload.total,payment:paymentMethod};OrlaFlow.saveOrders([localOrder,...OrlaFlow.orders()]);OrlaFlow.saveCheckout({});OrlaFlow.set([]);location="order-success.html?id="+encodeURIComponent(localOrder.id)}catch(err){OrlaCustomer.showMessage(error,err.message)}finally{OrlaCustomer.setLoading(button,false)}}});</script></body></html>
