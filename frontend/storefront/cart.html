<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | OrlaTrends</title><link rel="stylesheet" href="css/customer.css"></head><body><main class="page-wrap"><a class="brand-word" href="index.html">OrlaTrends</a><p class="page-kicker">Shopping bag</p><h1 class="page-title">Your Cart</h1><section class="checkout-layout"><div class="checkout-card"><div id="cartRows"></div></div><aside class="panel-card"><h2>Order summary</h2><div class="order-line"><span>Subtotal</span><strong id="total"></strong></div><div class="order-line"><span>Delivery</span><strong>Free</strong></div><a class="secondary-btn" style="display:block;text-align:center;margin-top:18px" href="checkout.html">Checkout</a></aside></section></main><script src="js/commerce-flow.js"></script><script>const render=()=>{let a=OrlaFlow.get(),r=document.querySelector('#cartRows');r.innerHTML=a.length?a.map((x,i)=>`<div class="order-line"><span><strong>${x.name||"Product"}</strong><br>${OrlaFlow.money(x.price)} × <input aria-label="Quantity" data-q="${i}" type="number" min="1" value="${x.quantity||1}" style="width:58px"></span><button class="ghost-btn" data-r="${i}">Remove</button></div>`).join(''):'<div class="empty-state">Your cart is empty. <a href="index.html">Continue shopping</a></div>';document.querySelector('#total').textContent=OrlaFlow.money(OrlaFlow.total(a));document.querySelectorAll('[data-q]').forEach(e=>e.onchange=()=>{a[e.dataset.q].quantity=Math.max(1,+e.value||1);OrlaFlow.set(a);render()});document.querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>{a.splice(e.dataset.r,1);OrlaFlow.set(a);render()})};render()</script></body></html>
