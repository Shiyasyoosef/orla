<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | OrlaTrends</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@300;400;500;600;700" rel="stylesheet">
  <link rel="stylesheet" href="css/customer.css?v=20260914r3">
</head>
<body class="customer-login-modal-page">
  <iframe class="auth-site-preview" src="index.html" title="OrlaTrends storefront" aria-hidden="true" tabindex="-1" inert></iframe>
  <div class="auth-site-scrim"></div>
  <main class="customer-shell customer-modal-shell">
    <section class="auth-card" aria-labelledby="resetTitle">
      <h1 id="resetTitle">Reset your password</h1>
      <p>Enter the email you use for your OrlaTrends account.</p>
      <form id="resetForm" class="form-grid">
        <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div id="resetError" class="error-box" role="alert"></div>
        <div id="resetSuccess" class="success-box" role="status"></div>
        <button class="primary-btn" type="submit">Send reset email</button>
      </form>
      <a class="auth-recovery" href="customer-login.html">Back to sign in</a>
    </section>
  </main>
  <nav class="mobile-bottom-nav" aria-label="Mobile bottom navigation">
    <a href="index.html" class="bottom-link"><span class="material-symbols-outlined">home</span><span>Home</span></a>
    <a href="category.html?category=new-in" class="bottom-link"><span class="material-symbols-outlined">category</span><span>Categories</span></a>
    <a href="index.html#sale" class="bottom-link"><span class="material-symbols-outlined">sell</span><span>Sale</span></a>
    <a href="customer-login.html" class="bottom-link is-active"><span class="material-symbols-outlined">person_add</span><span>Account</span></a>
    <a href="cart.html" class="bottom-link"><span class="material-symbols-outlined">shopping_cart_checkout</span><span>Cart</span></a>
  </nav>
  <script src="js/customer-auth.js"></script>
  <script>
    document.querySelector('#resetForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = event.submitter;
      OrlaCustomer.showMessage(document.querySelector('#resetError'), '');
      OrlaCustomer.showMessage(document.querySelector('#resetSuccess'), '');
      OrlaCustomer.setLoading(button, true, 'Sending...');
      try {
        await OrlaCustomer.resetPassword(event.currentTarget.email.value);
        OrlaCustomer.showMessage(document.querySelector('#resetSuccess'), 'If an account exists for this email, you will receive a password reset link. Check your inbox and spam folder.');
      } catch (error) {
        OrlaCustomer.showMessage(document.querySelector('#resetError'), error.message);
      } finally { OrlaCustomer.setLoading(button, false); }
    });
  </script>
</body>
</html>
